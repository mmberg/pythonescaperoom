<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 124 124" width="100%" height="100%">
  <defs>
    <!-- Glow Effects -->
    <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#387eb8" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe873" />
      <stop offset="100%" stop-color="#ffaa00" />
    </linearGradient>
  </defs>

  <!-- Python Logo Paths -->
  <g>
    <!-- Blaue Hälfte -->
    <path d="M 49.8 0 C 22.8 0 24.5 11.7 24.5 11.7 L 24.6 23.8 L 50.1 23.8 L 50.1 27.4 L 14.2 27.4 C 14.2 27.4 0 25.8 0 53.1 C 0 80.4 12.5 78.8 12.5 78.8 L 19.9 78.8 L 19.9 68.3 C 19.9 68.3 19.2 55.8 32.1 55.8 L 57.3 55.8 C 57.3 55.8 69.3 56.2 69.3 44.1 L 69.3 12.5 C 69.3 12.5 71.8 0 49.8 0 Z M 36.4 7.6 C 38.7 7.6 40.6 9.5 40.6 11.8 C 40.6 14.1 38.7 16 36.4 16 C 34.1 16 32.2 14.1 32.2 11.8 C 32.2 9.5 34.1 7.6 36.4 7.6 Z" fill="url(#blue-grad)" filter="url(#glow-blue)"/>
    <!-- Goldene Hälfte -->
    <path d="M 50.2 100 C 77.2 100 75.5 88.3 75.5 88.3 L 75.4 76.2 L 49.9 76.2 L 49.9 72.6 L 85.8 72.6 C 85.8 72.6 100 74.2 100 46.9 C 100 19.6 87.5 21.2 87.5 21.2 L 80.1 21.2 L 80.1 31.7 C 80.1 31.7 80.8 44.2 67.9 44.2 L 42.7 44.2 C 42.7 44.2 30.7 43.8 30.7 55.9 L 30.7 87.5 C 30.7 87.5 28.2 100 50.2 100 Z M 63.6 92.4 C 61.3 92.4 59.4 90.5 59.4 88.2 C 59.4 85.9 61.3 84 63.6 84 C 65.9 84 67.8 85.9 67.8 88.2 C 67.8 90.5 65.9 92.4 63.6 92.4 Z" fill="url(#gold-grad)" filter="url(#glow-gold)"/>
  </g>
</svg>
